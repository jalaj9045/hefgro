<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Steps - Bootstrap 5</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

    <!-- Custom CSS -->
    <link href="./styles.css" rel="stylesheet" />
  </head>
  <body>
    <main class="py-5">
      <div class="container">
        <div class="row g-4 row-cols-1 row-cols-md-3 justify-content-center">
          <!-- Card 1 -->
          <div class="col">
            <div class="feature-card h-100 p-4 p-md-5 position-relative">
              <div class="icon-wrap">
                <span class="icon-ring">
                  <i class="bi bi-gear-fill"></i>
                </span>
              </div>
              <h3 class="mt-3 mt-md-4 mb-3">Your Need</h3>
              <p class="mb-0 text-body-secondary">We are a Wiguard. We are here for you to fulfill all kinds of security needs.</p>
              <span class="step">01</span>
            </div>
          </div>

          <!-- Card 2 -->
          <div class="col">
            <div class="feature-card h-100 p-4 p-md-5 position-relative">
              <div class="icon-wrap">
                <span class="icon-ring">
                  <i class="bi bi-envelope-fill"></i>
                </span>
              </div>
              <h3 class="mt-3 mt-md-4 mb-3">Enquiry</h3>
              <p class="mb-0 text-body-secondary">Reach us anytime to enquire about our security services and offers.</p>
              <span class="step">02</span>
            </div>
          </div>

          <!-- Card 3 -->
          <div class="col">
            <div class="feature-card h-100 p-4 p-md-5 position-relative">
              <div class="icon-wrap">
                <span class="icon-ring">
                  <i class="bi bi-check2-square"></i>
                </span>
              </div>
              <h3 class="mt-3 mt-md-4 mb-3">Confirm</h3>
              <p class="mb-0 text-body-secondary">You can call anytime to our toll-free number to confirm your schedule.</p>
              <span class="step">03</span>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
